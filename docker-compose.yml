version: '3.8'

services:
  pdf-craft-webui:
    build: .
    container_name: pdf-craft-webui
    ports:
      - "5000:5000"
    volumes:
      # 持久化数据目录
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./models:/app/models
      - ./logs:/app/logs
      # 配置文件
      - ./jobs.pkl:/app/jobs.pkl
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=False
      - USE_GPU=False
      - BATCH_SIZE=5
      - MAX_WORKERS=4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - pdf-craft-network

  # 可选：添加Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: pdf-craft-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - pdf-craft-webui
    restart: unless-stopped
    networks:
      - pdf-craft-network
    profiles:
      - with-nginx

  # 可选：添加Redis缓存
  redis:
    image: redis:alpine
    container_name: pdf-craft-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - pdf-craft-network
    profiles:
      - with-redis

networks:
  pdf-craft-network:
    driver: bridge

volumes:
  redis_data: 